<script>
const U=['公里','公尺','公分'],EXP=[3,2],NS='http://www.w3.org/2000/svg';
let Q,steps,step=0,sub=0,anim=false;
const $=id=>document.getElementById(id), svg=$('svg');
const el=(t,at,txt)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e};

function calc(str,k){
  const [ip,fp='']=str.split('.'), dg=(ip+fp).split('').map(Number), pad=7;
  const all=[...Array(pad).fill(0),...dg,...Array(pad+3).fill(0)];
  const P0=ip.length+pad, Pf=P0+k;
  const int=all.slice(0,Pf).join('').replace(/^0+/,'')||'0', fr=all.slice(Pf).join('').replace(/0+$/,'');
  return {all,P0,Pf,pad,n:dg.length,res:int+(fr?'.'+fr:'')};
}
function setup(){
  const s=$('v').value.trim(), a=+$('a').value, b=+$('b').value;
  if(!/^\d{1,5}(\.\d{1,2})?$/.test(s)){$('msg').textContent='請輸入最多 5 位整數、最多 2 位小數的數字，例如 2.5。';return}
  $('msg').textContent='';
  let k=0,gaps=[];
  if(a<b){for(let g=a;g<b;g++){gaps.push(g);k+=EXP[g]}}
  else if(a>b){for(let g=a-1;g>=b;g--){gaps.push(g);k-=EXP[g]}}
  Q={s,a,b,k,gaps,down:a<b,K:Math.abs(k),...calc(s,k)};
  steps=a==b?['q','ans']:['q','dir','jump','slide','ans'];
  step=0;sub=0;render();
}
const mul=g=>(Q.down?'×':'÷')+Math.pow(10,EXP[g]);
function cur(sb){ // 滑 sb 格後目前所在單位
  let c=0,u=Q.a;for(const g of Q.gaps){c+=EXP[g];if(sb>=c)u=Q.down?g+1:g;}return u}
function textFor(){
  const st=steps[step], A=`<span class="b">${Q.s} ${U[Q.a]}</span>`, B=`<span class="o">幾${U[Q.b]}</span>`;
  if(st=='q')return [`把 ${A} 換成 ${B}？`,'先看單位階梯：公里、公尺、公分排成三階。'];
  if(st=='dir')return Q.down?['大單位換小單位，要「往右走」。','往右走，數字會變大，所以用乘法。']:['小單位換大單位，要「往左走」。','往左走，數字會變小，所以用除法。'];
  if(st=='jump')return [`從${U[Q.a]}走到${U[Q.b]}，要走 ${Q.gaps.length} 階。`,`每一階的倍數寫在右邊：${Q.gaps.map(mul).join('、')}。`];
  if(st=='slide'){
    const dir=Q.down?'右':'左';
    if(sub==0)return [`這是 ${A}，小數點在這裡。`,`等一下要把小數點往${dir}滑 ${Q.K} 格（${Q.gaps.map(g=>EXP[g]).join('＋')}）。`];
    const u=cur(sub), hit=u!=cur(sub-1);
    if(sub==Q.K)return [`滑完了！<span class="g">${Q.res} ${U[Q.b]}</span>`,'小數點每滑 1 格，就是乘（或除）10；空位補 0。'];
    return [`小數點往${dir}滑了 ${sub} 格，空位補 0。`,hit?`<b>到${U[u]}囉！</b> 再繼續滑。`:'再按「小教室下一步」。'];
  }
  const ex=Q.gaps.length?Q.s+' '+Q.gaps.map(mul).join(' ')+' = ':'';
  return [`<span class="b">${Q.s} ${U[Q.a]}</span> = <span class="g">${Q.res} ${U[Q.b]}</span>`,Q.gaps.length?`算式：${ex}${Q.res}。階梯圖和小數點滑動，答案一樣。`:'單位一樣，數字不用變。'];
}
function ladder(st){
  const RX=i=>20+i*255, on=i=>i==Q.a||(i==Q.b&&Q.a!=Q.b&&st!='q');
  for(let i=0;i<3;i++){
    const isA=i==Q.a, isB=i==Q.b&&Q.a!=Q.b;
    const fill=isA?'var(--blue)':isB&&st!='q'?(st=='ans'?'var(--grn)':'var(--org)'):'var(--line)';
    el('rect',{x:RX(i),y:100,width:160,height:80,rx:14,fill,'fill-opacity':on(i)?1:.45});
    el('text',{x:RX(i)+80,y:150,'text-anchor':'middle','font-size':28,'font-weight':700,style:'fill:'+(on(i)?'#fff':'var(--fg)')},U[i]);
  }
  const arrow=(g)=>{const x1=RX(g)+166,x2=RX(g+1)-6,d=Q.down;
    el('line',{x1:d?x1:x2,y1:140,x2:d?x2-8:x1+8,y2:140,stroke:'var(--amb)','stroke-width':6});
    el('polygon',{points:d?`${x2},140 ${x2-16},128 ${x2-16},152`:`${x1},140 ${x1+16},128 ${x1+16},152`,style:'fill:var(--amb)'})};
  if(st=='dir'){Q.gaps.forEach(arrow);
    el('text',{x:350,y:270,'text-anchor':'middle','font-size':34,'font-weight':700,style:'fill:var(--amb)'},Q.down?'往右走 → 乘':'往左走 → 除')}
  else if(st=='jump'||st=='slide')Q.gaps.forEach(g=>{arrow(g);
    el('text',{x:RX(g)+213,y:80,'text-anchor':'middle','font-size':26,'font-weight':700,style:'fill:var(--amb)'},mul(g)+(Q.down?'（'+EXP[g]+'個0）':''))});
  if(st=='q'){el('text',{x:350,y:250,'text-anchor':'middle','font-size':34,'font-weight':700,style:'fill:var(--blue)'},Q.s+' '+U[Q.a]);
    el('text',{x:350,y:300,'text-anchor':'middle','font-size':34,'font-weight':700,style:'fill:var(--org)'},'= ？ '+U[Q.b])}
  if(st=='ans')el('text',{x:350,y:270,'text-anchor':'middle','font-size':34,'font-weight':700,style:'fill:var(--grn)'},Q.res+' '+U[Q.b]);
}
function slider(){
  const {all,P0,Pf,pad,n}=Q, first=pad, last=pad+n;
  const lo=Math.min(first,P0-1,Pf-1), hi=Math.max(last,P0,Pf)+0, cnt=hi-lo;
  const w=Math.min(64,640/cnt), x0=(700-cnt*w)/2, y=110, h=90;
  const sign=Q.down?1:-1, Pc=P0+sign*sub, Pp=P0+sign*Math.max(sub-1,0);
  for(let i=lo;i<hi;i++){
    const orig=i>=first&&i<last;
    el('rect',{x:x0+(i-lo)*w+2,y,width:w-4,height:h,rx:8,fill:orig?'var(--bg)':'var(--ambbg)',stroke:orig?'var(--blue)':'var(--line)','stroke-width':orig?3:1.5});
    if(orig||(Q.down?i>=first&&i<Pc:i>=Pc&&i<last+99)||true){
      const show=orig||(Q.down?(i>=last&&i<Pc):(i<first&&i>=Pc)||(!Q.down&&Pc<=first&&i==Pc-1));
      if(show)el('text',{x:x0+(i-lo+.5)*w,y:y+62,'text-anchor':'middle','font-size':w*.7,'font-weight':700},all[i]);
    }
  }
  el('text',{x:350,y:60,'text-anchor':'middle','font-size':30,'font-weight':700,style:'fill:var(--blue)'},'現在是：'+U[cur(sub)]);
  const c=el('circle',{cx:0,cy:y+h-6,r:9,style:'fill:var(--org)'});
  const X=p=>x0+(p-lo)*w;
  if(anim){c.style.transform=`translate(${X(Pp)}px,0)`;requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transition='transform .45s';c.style.transform=`translate(${X(Pc)}px,0)`}))}
  else c.style.transform=`translate(${X(Pc)}px,0)`;
  el('text',{x:350,y:270,'text-anchor':'middle','font-size':24,style:'fill:var(--mut)'},'黃底格子 = 補上的 0');
}
function render(){
  const st=steps[step], inSub=st=='slide';
  svg.innerHTML='';$('card').classList.toggle('lite',inSub);
  if(inSub)slider();else ladder(st);
  anim=false;
  const [m,s]=textFor();$('txt').innerHTML=`<div class="m">${m}</div><div class="s">${s}</div>`;
  $('pv').textContent=inSub?'← 小教室上一步':'← 上一步';$('nx').textContent=inSub?'小教室下一步 →':'下一步 →';
  $('prog').textContent=inSub?`小教室 ${sub+1} / ${Q.K+1}`:`步驟 ${step+1} / ${steps.length}`;
  $('pv').disabled=step==0&&!inSub;$('nx').disabled=step==steps.length-1&&!inSub;
}
function go(d){
  const st=steps[step];
  if(st=='slide'){const n=sub+d;
    if(n>=0&&n<=Q.K){sub=n;anim=d>0;return render()}
    if(n<0){step--}else{step++}
  }else{const n=step+d;if(n<0||n>=steps.length)return;step=n;if(steps[step]=='slide')sub=d>0?0:Q.K}
  render();
}
$('pv').onclick=()=>go(-1);$('nx').onclick=()=>go(1);
['v','a','b'].forEach(i=>$(i).addEventListener('input',setup));
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'||e.target.tagName=='SELECT')return;if(e.key=='ArrowLeft')go(-1);if(e.key=='ArrowRight')go(1)});
if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.head.insertAdjacentHTML('beforeend','<style>*{transition:none!important}</style>');
/*WS-START*/
let seed=Date.now()%100000,WS,DL=null;
const rng=n=>()=>{n|=0;n=n+0x6D2B79F5|0;let t=Math.imul(n^n>>>15,1|n);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function path(a,b){let k=0,g=[];if(a<b){for(let i=a;i<b;i++){g.push(i);k+=EXP[i]}}else{for(let i=a-1;i>=b;i--){g.push(i);k-=EXP[i]}}return{k,g}}
const BND=[1,4,6];
function tcm(q){return calc(q.v,path(q.a,2).k).res.padStart(6,'0')}
function genWS(sd){
  const r=rng(sd),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),pick=a=>a[Math.floor(r()*a.length)];
  // 位值表只有 6 格（公里1＋公尺3＋公分2），所以每個數量都要小於 10 公里
  const val=u=>{const x=r();return u==0?(x<.4?''+ri(1,9):x<.8?`${ri(1,9)}.${ri(1,9)}`:`${ri(1,9)}.${ri(1,9)}${ri(1,9)}`):(x<.45?''+ri(1,999):x<.85?`${ri(1,99)}.${ri(1,9)}`:`${ri(1,9)}.${ri(1,9)}${ri(1,9)}`)};
  const D=[[0,1],[1,2],[0,2]], pairs=()=>[...D,pick(D)].sort(()=>r()-.5);
  const exs=(a,b)=>path(a,b).g.map(g=>(a<b?'×':'÷')+Math.pow(10,EXP[g])).join(' ');
  const s1=pairs().map(([a,b])=>{const v=val(a);return{v,a,b,ans:calc(v,path(a,b).k).res,ex:exs(a,b)}});
  const s2=pairs().map(([a,b])=>{const t=val(a),K=Math.abs(path(a,b).k);return{v:calc(t,K).res,a:b,b:a,ans:t,ex:exs(b,a)}});
  const s3=[0,1,2].map(i=>{const [a,b]=D[(i+ri(0,2))%3],v=val(a),R=calc(v,path(a,b).k).res,c=['>','<','='][(i+ri(0,2))%3],d=Math.max(1,Math.round(+R*.1));
    return{v,a,b,R,ans:c,right:c=='='?R:c=='>'?''+(+R-d):''+(+R+d),cmp:1}});
  return[{title:'一、大單位換小單位（乘）',qs:s1},{title:'二、小單位換大單位（除）',qs:s2},{title:'三、比一比大小（填 ＞、＜、＝）',qs:s3}];
}
/*WS-END*/
function showWS(){
  let n=0;$('wsv').innerHTML=`<div class="s" style="color:var(--mut)">題組編號 ${seed}（題目與解答同一組）</div>`+WS.map(sc=>`<div class="t">${sc.title}</div>`+sc.qs.map(q=>`<div class="q">(${++n}) ${q.cmp?`${q.v} ${U[q.a]} ○ ${q.right} ${U[q.b]}`:`${q.v} ${U[q.a]} = ？ ${U[q.b]}`}</div>`).join('')).join('');
}
function newWS(){seed=Math.floor(Math.random()*90000)+10000;WS=genWS(seed);showWS()}
async function drawPage(ans){
  const c=document.createElement('canvas');c.width=1654;c.height=2339;const x=c.getContext('2d');
  const F=(z,w='')=>`${w} ${z}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
  x.fillStyle='#fff';x.fillRect(0,0,1654,2339);
  x.fillStyle='#111';x.font=F(64,'bold');x.textAlign='center';x.fillText(ans?'長度單位換算練習單（解答）':'長度單位換算練習單',827,140);
  x.textAlign='left';x.font=F(34);x.fillText('班級：_______　座號：_____　姓名：__________　日期：________',120,225);
  let y=330,n=0,px=0;
  const TW=95,TX=1654-70-6*TW;
  const w=(t,col='#111')=>{x.fillStyle=col;x.font=F(42);x.fillText(t,px,y);px+=x.measureText(t).width};
  const box=(wd,t)=>{x.strokeStyle='#888';x.lineWidth=3;x.strokeRect(px,y-48,wd,66);if(t){x.fillStyle='#d00';x.font=F(42,'bold');x.textAlign='center';x.fillText(t,px+wd/2,y);x.textAlign='left'}px+=wd};
  const table=q=>{const ty=y-76,hh=38,bh=66;let cx=TX;
    [['公里',1,'#ffecec'],['公尺',3,'#ffe6d6'],['公分',2,'#fff0cc']].forEach(([t,k,f])=>{x.fillStyle=f;x.fillRect(cx,ty,k*TW,hh+bh);x.fillStyle='#444';x.font=F(26);x.textAlign='center';x.fillText(t,cx+k*TW/2,ty+28);cx+=k*TW});
    x.strokeStyle='#999';x.lineWidth=2;x.strokeRect(TX,ty,6*TW,hh+bh);x.beginPath();x.moveTo(TX,ty+hh);x.lineTo(TX+6*TW,ty+hh);
    for(let i=1;i<6;i++){x.moveTo(TX+i*TW,BND.includes(i)?ty:ty+hh);x.lineTo(TX+i*TW,ty+hh+bh)}x.stroke();
    if(ans){const d=tcm(q),f=d.search(/[1-9]/);x.font=F(44,'bold');
      for(let i=0;i<6;i++){x.fillStyle=i<f?'#bbb':'#d00';x.fillText(d[i],TX+(i+.5)*TW,ty+hh+48)}
      [[q.a,'#2563eb'],[q.b,'#d00']].forEach(([u,col])=>{x.fillStyle=col;x.beginPath();x.arc(TX+BND[u]*TW,ty+hh+bh-9,9,0,7);x.fill()})}
    x.textAlign='left'};
  WS.forEach(sc=>{x.fillStyle='#1d4ed8';x.font=F(46,'bold');x.fillText(sc.title,120,y);y+=100;
    sc.qs.forEach(q=>{n++;px=140;
      if(q.cmp){w(`(${n}) ${q.v} ${U[q.a]}  `);box(90,ans?q.ans:'');w(`  ${q.right} ${U[q.b]}`)}
      else{w(`(${n}) ${q.v} ${U[q.a]} = `);box(230,ans?q.ans:'');w(` ${U[q.b]}`)}
      table(q);
      if(ans){x.font=F(30);x.fillStyle='#d00';x.fillText(q.cmp?`${q.v} ${U[q.a]} = ${q.R} ${U[q.b]}`:`算式：${q.ex}`,140,y+54)}
      y+=135});y+=15});
  x.fillStyle='#777';x.font=F(32);
  x.fillText(ans?'紅字為答案與算式。':'小提醒：公里 →（×1000）→ 公尺 →（×100）→ 公分；反過來就用除。',120,2230);
  x.fillText(ans?'藍點＝原來單位的小數點，紅點＝要換成的單位的小數點；灰色的 0 是補位。':'位值表：數字一格填一個（0 也要填），再把小數點滑到要換成的單位。',120,2290);
  return c;
}
async function makePDF(){
  try{await document.fonts.load('40px "Noto Sans TC"')}catch(e){}
  const a=await drawPage(false),b=await drawPage(true),d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  d.addImage(a.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);d.addPage();d.addImage(b.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);
  return d.output('blob');
}
$('rn').onclick=()=>{newWS();$('dlmsg').textContent=''};
$('dl').onclick=async()=>{const bt=$('dl');bt.disabled=true;$('dlmsg').textContent='製作中…';
  try{await DL.save({filename:`長度單位作業單_${seed}.pdf`,data:await makePDF()});$('dlmsg').textContent='已送出下載。'}
  catch(e){$('dlmsg').textContent=e&&e.code=='declined'?'已取消下載。':'製作失敗，請再按一次。'}
  bt.disabled=false};
(window.claude?claude.use('downloads'):Promise.resolve(null)).then(d=>{DL=d;if(d)$('dl').disabled=false;else $('dlmsg').textContent='此環境無法下載，請在 claude.ai 開啟。'}).catch(()=>{$('dlmsg').textContent='此環境無法下載。'});
newWS();
setup();
</script>
